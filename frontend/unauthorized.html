<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Denied | Smart Attendance</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1a0533 0%,#2d1060 50%,#1a0533 100%); }
        .error-card { background:#fff; border-radius:20px; padding:3rem 2rem; text-align:center; max-width:420px; width:100%; box-shadow:0 25px 60px rgba(0,0,0,.4); }
        .error-icon { font-size:4rem; margin-bottom:1rem; }
        .error-code { font-size:5rem; font-weight:900; color:#7c3aed; margin:0; line-height:1; }
        .error-title { font-size:1.3rem; font-weight:700; color:#1e1b4b; margin:.5rem 0; }
        .error-msg { color:#6b7280; font-size:.95rem; margin-bottom:2rem; }
        .btn-row { display:flex; gap:.75rem; justify-content:center; }
        .btn { padding:.75rem 1.5rem; border-radius:10px; font-size:.9rem; font-weight:700; cursor:pointer; border:none; text-decoration:none; display:inline-flex; align-items:center; gap:.4rem; }
        .btn-primary { background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; }
        .btn-outline { background:#fff; color:#7c3aed; border:2px solid #7c3aed; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">🚫</div>
        <div class="error-code">403</div>
        <div class="error-title">Access Forbidden</div>
        <p class="error-msg">You don't have permission to view this page. Please log in with the correct account.</p>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="history.back()">← Go Back</button>
            <a href="index.html" class="btn btn-primary">🔑 Login Again</a>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
